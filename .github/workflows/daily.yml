name: 매일 사역게시판 정리

on:
  schedule:
    - cron: '43 21 * * *' # UTC 21:43 = 한국 시간 6:43. 정각엔 GitHub 예약이 몰려 20분 이상 늦어져서 피했어요
  workflow_dispatch: # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 글 모으고 카톡 보내기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node digest.mjs

      - name: 정리 페이지 올리기
        if: always() # 카톡 전송이 실패해도 페이지는 올립니다
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          if [ -d state ]; then git add state; fi
          git diff --cached --quiet || git commit -m "사역게시판 정리 $(TZ=Asia/Seoul date +%F)"
          git push
