name: 매일 사역게시판 정리

on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = 한국 시간 아침 7시 (GitHub 사정으로 몇 분~수십 분 늦을 수 있어요)
  workflow_dispatch: # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 글 모으고 카톡 보내기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node digest.mjs

      - name: 새 리프레시 토큰 저장
        if: hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set KAKAO_REFRESH_TOKEN < .new_refresh_token && rm .new_refresh_token

      - name: 정리 페이지 올리기
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "사역게시판 정리 $(TZ=Asia/Seoul date +%F)"
          git push
